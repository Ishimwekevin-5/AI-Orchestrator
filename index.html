    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Saira', sans-serif;
            background-color: #fafafa;
            color: #09090b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4d4d8;
        }
        
        .animate-in {
            animation: animate-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes animate-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tracking-sharp {
            letter-spacing: -0.01em;
        }

        /* Improved text orientation and alignment for reports */
        .report-content {
            text-align: justify;
            text-justify: inter-word;
            line-height: 1.7;
            letter-spacing: 0.01em;
        }
    </style>
